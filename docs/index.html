<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div class="main-container">
        <h1>
            Welcome to the Assorted Discoveries Wiki
        </h1>

        <label for="search"></label>
        <input type="text" id="search" name="search">

        <h2>
            Here are some pages to get you started:
        </h2>

        <div class="recommendation-container">
            <div class="recommendation-item">
                <img class="recommendation-img" src="image_renders/bog_blossom.png" alt="An image of an oak planter box">
                <a href="./bog_blossom.html">Visit the page all about the bog blossoms!</a>
            </div>

            <div class="recommendation-item">
                <img class="recommendation-img" src="image_renders/oak_planter_box.png" alt="An image of an oak planter box">
                <a href="./planter_box.html">Visit the page all about planter boxes!</a>
            </div>
        </div>
    </div>
</body>
</html>

<script src=" https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js "></script>

<script>
    let miniSearch = new MiniSearch({
        fields: ['title'],
        storeFields: ['title']
    })

    const documents = [
        {
            id: 1,
            title: 'bog_blossom'
        },
        {
            id: 2,
            title: 'planter box'
        }
    ]

    miniSearch.addAll(documents)

    const searchInput = document.getElementById('search')

    searchInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            const query = event.target.value.toLowerCase();

            if (query.trim() === '') return;

            let results = miniSearch.search(query, {
                prefix: true, // partial word matching
                fuzzy: 0.2    // allow minor misspellings
            });

            const topResult = results[0].title

            window.location.href = (topResult + '.html').replaceAll(' ', '_')
        }
    })

</script>
