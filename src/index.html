<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js" defer></script>
    <script src="./js/welcome.js" defer></script>
    <link rel="stylesheet" href="./css/welcome.css">
    <link rel="stylesheet" href="./css/main.css">
    <meta charset="UTF-8">
    <title>Assorted Discoveries Wiki</title>
    <link rel="icon" href="./icon.png" type="image/png">
</head>
<body>
    <div class="main-container">
        <h1>
            Welcome to the Assorted Discoveries Wiki
        </h1>

        <div class="search-container">
            <label for="search"></label>
            <input type="text" id="search" name="search" placeholder="Start typing to search...">
            <ul id="suggestion-list"></ul>
        </div>

        <h2>
            Here are some pages to get you started:
        </h2>

        <div class="recommendation-container">
            <div class="recommendation-item">
                <img class="recommendation-img" src="./img/bog_blossom.png" alt="An image of an oak planter box">
                <a href="./pages/bog_blossom.html">Visit the page all about the bog blossoms!</a>
            </div>

            <div class="recommendation-item">
                <img class="recommendation-img" src="./static/img/oak_planter_box.png" alt="An image of an oak planter box">
                <a href="./pages/planter_box.html">Visit the page all about planter boxes!</a>
            </div>

            <div class="recommendation-item">
                <img class="recommendation-img" src="./static/img/oak_rope_ladder.png" alt="An image of an oak rope ladder">
                <a href="./pages/rope_ladder.html">Visit the page all about planter boxes!</a>
            </div>
        </div>
    </div>
</body>
</html>
